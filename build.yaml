name: "SSO-Auth"
guid: "505ce9d1-d916-42fa-86ca-673ef241d7df"
imageUrl: "https://raw.githubusercontent.com/9p4/jellyfin-plugin-sso/main/img/logo.png"
version: "6.0.0.1"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "MaxRink"
overview: "Authenticate users against an SSO provider."
description: |
  This plugin allows users to sign in through an SSO provider (such as Google, Facebook, or your own provider). This enables one-click signin.
  Review documentation at https://github.com/MaxRink/jellyfin-plugin-sso
category: "Authentication"
artifacts:
  - "SSO-Auth.dll"
  - "Duende.IdentityModel.OidcClient.dll"
  - "Duende.IdentityModel.dll"
  - "Microsoft.IdentityModel.JsonWebTokens.dll"
  - "Microsoft.IdentityModel.Tokens.dll"
  - "Microsoft.IdentityModel.Logging.dll"
  - "Microsoft.IdentityModel.Abstractions.dll"
changelog: |
  6.0.0.1: Show the SSO settings page in the dashboard sidebar (Plugins section) like other configurable plugins.
  6.0.0.0: Jellyfin 12 support (net10.0, targetAbi 12.0.0.0), built against Jellyfin.Controller/Model 12.0.0. Removed the vulnerable System.Security.Cryptography.Xml package (provided by the net10 shared framework) and the unused F# helper project. Security - account linking now starts from the authenticated self-service page (POST OID|SAML/StartLink), states are single-use, provider-bound and expire after 10 minutes, SAML responses are checked against the request they answer, and an identity already linked to another user is refused; the unauthenticated ?isLinking=true start is no longer accepted. The linking page authenticates with the Authorization header (the legacy header is ignored by Jellyfin 12). OpenID links are keyed by the sub claim with automatic migration of username-keyed links. New per-provider option disableUsernameAccountAdoption. roleClaim accepts several space-separated claim paths and JSON-object-keyed roles (Zitadel); enabledFolders is always applied; data: avatar URLs are accepted; Cloudflare Access UserInfo failures are reported clearly. Requests to the identity provider go through Jellyfin's dual-stack HTTP client with a 30 second timeout and report 502/504 with the endpoint instead of hanging for 100 seconds (#2). Pre-existing local/LDAP accounts keep their auth provider; default library access is only stripped when the plugin manages permissions. Plus many robustness fixes adopted from community forks (see README Acknowledgements).
  5.0.0.1: Restyle the sign-in handoff page to match Jellyfin: native MDL spinner with the status text centered beneath it, and errors shown in red instead of plain text. Themeable via CSS variables.
  5.0.0.0: Overhaul the auth handoff so SSO login works in the native Jellyfin mobile apps (Android & iOS Expo), not just the web UI. Credentials are now built directly from the auth response and applied in the top frame instead of polling an iframed web client's localStorage, which never completed inside the native apps. Failures now surface an error instead of hanging on "Logging in...".
  4.0.0.6: Add OID device code flow authentication endpoint (POST /sso/OID/DeviceAuth/{provider}, RFC 8628).
  4.0.0.5: Fix login on Jellyfin 10.11 when canonical links point to a stale user GUID (#315)
  4.0.0.4: Fix security issue in SAML
  4.0.0.0: Jellyfin 10.11
  3.5.3.0: Allow for OID-provided avatars, various bugfixes and workarounds
  3.5.2.4: Updates for Jellyfin 10.9
  3.5.2.3: Improve OpenID discovery policy security rules, fix iOS login bugs related to cache
  3.5.2.2: Fix linking page when using new paths
  3.5.2.1: Hotfix for SAML null checks
  3.5.2.0: Allow overriding the scheme used for generating URLs.
  3.5.1.1: Change iframe URL to point to the web UI instead of the root 
  3.5.1.0: Improved paths! No more obscure "p" versus "r" URLs! Improve final redirect for automatic authentication. Add more configuration options for OpenID discovery.
  3.5.0.0: Add support for Live TV authentication. Fix various null pointer bugs.
  3.4.0.0: Add user self-service for linking existing accounts + managing existing links. Allow IDP accounts to be linked to jellyfin accounts with a different display-name.
  3.3.0.0: Add fallback authentication provider. Add OpenID admin page.
  3.2.0.0: Switch to hashmaps (BREAKING) for performance. Dump expected permissions in logs on error.
  3.1.0.1: Fix redirect bug in WebResponse (#7)
  3.1.0.0: Simplify auth flow so loading the web UI is not required
  3.0.0.0: Add more RBAC features and option to unregister user from SSO
  2.0.1.0: Fix improper artifact loading
  2.0.0.0: Add RBAC and Google support
  1.0.0.0: Initial Release
